<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#922a2a">
  <title>Eu sabia! 💖</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #922a2a;
      color: #fff7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 20% 30%, #c1483a 0, transparent 40%),
        radial-gradient(ellipse at 85% 75%, #6f1d26 0, transparent 45%),
        #922a2a;
    }

    main {
      width: min(100%, 620px);
      padding: clamp(32px, 8vw, 64px);
      border: 1px solid #f5d8c744;
      border-radius: 28px;
      background: #fffaf0f2;
      box-shadow: 0 24px 80px #40151866;
      color: #713f39;
      text-align: center;
      animation: arrive 700ms ease both;
    }

    .heart {
      margin: 0 0 18px;
      color: #df7181;
      font-size: clamp(72px, 18vw, 112px);
      line-height: 1;
      text-shadow: 0 8px 22px #df718155;
      animation: beat 1.1s ease-in-out infinite;
    }

    h1 {
      margin: 0 0 16px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 8vw, 52px);
      line-height: 1.15;
    }

    p {
      margin: 0;
      font-size: clamp(18px, 4vw, 22px);
      line-height: 1.6;
    }

    .celebration {
      margin-top: 24px;
      font-size: 32px;
      letter-spacing: 8px;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="heart" aria-hidden="true">♥</div>
    <h1>Eu sabia! 💖</h1>
    <p>Você acabou de deixar meu dia perfeito!<br>Te amo muito! ❤️</p>
    <div class="celebration" aria-hidden="true">✨ 💕 ✨</div>
  </main>
</body>
</html>
